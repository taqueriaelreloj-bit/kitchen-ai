name: Apply professional room 3D v2

on:
  push:
    branches:
      - feature/professional-room-3d-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/professional-room-3d-v2
          fetch-depth: 0

      - name: Decode and apply professional 3D source
        run: |
          cat .patch/professional-room-3d-v2/chunk-* > /tmp/professional-room-3d-v2.b64
          base64 --decode /tmp/professional-room-3d-v2.b64 > /tmp/professional-room-3d-v2.tar.xz
          tar -xJf /tmp/professional-room-3d-v2.tar.xz -C .
          rm -rf .patch/professional-room-3d-v2
          rm -f .github/workflows/apply-professional-room-3d-v2.yml

      - name: Commit integrated 3D designer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add professional editable room 3D designer"
          git push origin HEAD:feature/professional-room-3d-v2
