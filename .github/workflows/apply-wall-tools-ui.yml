name: Apply Continuous Wall UI

on:
  push:
    branches: [feature/wall-chain-tools]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Wire continuous wall tools') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wall-chain-tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - run: node scripts/apply-wall-tools-ui.mjs
      - run: |
          git config user.name "Kitchen AI Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Wire continuous wall tools into editors"
          git push origin HEAD:feature/wall-chain-tools
