name: Apply Door Swing Visuals

on:
  push:
    branches: [feature/door-swing-visuals]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Wire door swing visuals') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/door-swing-visuals
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - run: node scripts/apply-door-swing-visuals.mjs
      - run: |
          git config user.name "Kitchen AI Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Wire door swing visuals into 2D and 3D"
          git push origin HEAD:feature/door-swing-visuals
