name: Build professional dollhouse 3D review

on:
  push:
    branches:
      - review/professional-dollhouse-3d
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify review build
        run: |
          npm run typecheck
          npm test -- --runInBand
          npm run build:web

      - name: Upload web review
        uses: actions/upload-artifact@v4
        with:
          name: kitchen-ai-professional-dollhouse-review
          path: dist
          if-no-files-found: error
          retention-days: 7
