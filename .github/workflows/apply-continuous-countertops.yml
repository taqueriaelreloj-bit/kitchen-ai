name: Apply Continuous Countertops

on:
  push:
    branches: [feature/continuous-countertops]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Wire continuous countertops') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/continuous-countertops
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - run: node scripts/apply-continuous-countertops.mjs
      - run: |
          git config user.name "Kitchen AI Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Wire continuous countertops into WebGL"
          git push origin HEAD:feature/continuous-countertops
