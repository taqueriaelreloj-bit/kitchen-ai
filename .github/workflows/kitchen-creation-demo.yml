name: Build Kitchen AI Creation Demo

on:
  push:
    branches:
      - review/kitchen-creation-demo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build current web app
        run: npm run build:web

      - name: Upload demo build
        uses: actions/upload-artifact@v4
        with:
          name: kitchen-ai-creation-demo
          path: dist
          if-no-files-found: error
          retention-days: 7
