name: Apply Cabinet Front Layouts

on:
  push:
    branches: [feature/cabinet-front-layouts]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Wire cabinet front layouts') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cabinet-front-layouts
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - run: node scripts/apply-cabinet-front-layouts.mjs
      - run: |
          git config user.name "Kitchen AI Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Wire cabinet front layouts into WebGL and BOM"
          git push origin HEAD:feature/cabinet-front-layouts
