name: Apply Cabinet Placement UI

on:
  push:
    branches: [feature/cabinet-wall-placement]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Wire cabinet placement tools') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cabinet-wall-placement
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - run: node scripts/apply-cabinet-placement-ui.mjs
      - run: |
          git config user.name "Kitchen AI Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Wire cabinet placement tools into editors"
          git push origin HEAD:feature/cabinet-wall-placement
