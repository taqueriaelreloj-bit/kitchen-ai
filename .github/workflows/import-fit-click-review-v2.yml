name: Build Kitchen AI 10x11 Improved Review

on:
  push:
    branches:
      - review/import-fit-click-page-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web review
        run: npm run build:web

      - name: Upload web review
        uses: actions/upload-artifact@v4
        with:
          name: kitchen-ai-import-fit-review-v2
          path: dist
          if-no-files-found: error
          retention-days: 7
