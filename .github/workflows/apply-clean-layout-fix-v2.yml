name: Apply clean no-camera layout fix v2

on:
  push:
    branches: [fix/clean-manual-starter-layout]
    paths:
      - '.github/workflows/apply-clean-layout-fix-v2.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/clean-manual-starter-layout
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm

      - name: Apply corrected source patches
        shell: bash
        run: |
          sed -n '/^[[:space:]]*H4s/{s/^[[:space:]]*//;p;q;}' .github/workflows/apply-clean-layout-fix.yml | base64 -d | gzip -d > /tmp/clean-layout.patch
          git apply --check /tmp/clean-layout.patch
          git apply /tmp/clean-layout.patch
          cat <<'B64' | base64 -d | gzip -d > /tmp/clean-layout-fixup.patch
          
          B64
          git apply --check /tmp/clean-layout-fixup.patch
          git apply /tmp/clean-layout-fixup.patch
          rm -rf .github/patches
          rm -f .github/workflows/apply-clean-layout-fix.yml .github/workflows/apply-clean-layout-fix-v2.yml .github/workflows/export-clean-layout-source.yml

      - name: Install dependencies
        run: npm ci

      - name: Verify corrected program
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build:web

      - name: Commit corrected source
        shell: bash
        run: |
          git config user.name "Kitchen AI Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix no-camera flow and clean starter kitchen layout"
          git push origin HEAD:fix/clean-manual-starter-layout
