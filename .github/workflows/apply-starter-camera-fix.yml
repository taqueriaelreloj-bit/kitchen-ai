name: Apply front-facing starter camera fix

on:
  push:
    branches: [fix/starter-3d-camera-view]
    paths:
      - '.github/workflows/apply-starter-camera-fix.yml'

permissions:
  contents: write

jobs:
  fix-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/starter-3d-camera-view
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm

      - name: Apply camera correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/domain/professional3d.ts')
          text = path.read_text()
          old = """  return {
              ...fitted,
              yaw: 42,
              pitch: 48,
              distance: clamp(fitted.distance * .78, 230, 1100),
            };
          """
          new = """  return {
              ...fitted,
              // Open dollhouse views from the front-left. The previous positive
              // yaw placed tall appliances closest to the camera, hiding the
              // cabinet run and making an ordered kitchen look cluttered.
              yaw: -42,
              pitch: 36,
              distance: clamp(fitted.distance * .82, 230, 1100),
            };
          """
          if old not in text:
              raise SystemExit('professional dollhouse camera block was not found')
          path.write_text(text.replace(old, new))

          test = Path('src/__tests__/professional3d.test.ts')
          text = test.read_text()
          text = text.replace("expect(dollhouse.yaw).toBe(42);", "expect(dollhouse.yaw).toBe(-42);")
          text = text.replace("expect(dollhouse.pitch).toBe(48);", "expect(dollhouse.pitch).toBe(36);")
          text = text.replace("professionalWallOpacity(box,42,'dollhouse'", "professionalWallOpacity(box,-42,'dollhouse'")
          text = text.replace("professionalWallOpacity(north,42,'dollhouse'", "professionalWallOpacity(north,-42,'dollhouse'")
          text = text.replace("professionalWallOpacity(south,42,'dollhouse'", "professionalWallOpacity(south,-42,'dollhouse'")
          test.write_text(text)

          demo = Path('src/domain/luisKitchenDemo.ts')
          text = demo.read_text()
          text = text.replace(
              "description: 'A balanced 10-foot appliance wall with a compact preparation island and clear circulation.',",
              "description: 'A balanced 10-foot appliance wall shown from the open front-left corner, with a compact sink island and clear circulation.',",
          )
          demo.write_text(text)
          PY
          rm -f .github/workflows/apply-starter-camera-fix.yml

      - name: Install dependencies
        run: npm ci

      - name: Verify corrected program
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build:web

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "Kitchen AI Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix starter 3D camera to show cabinet fronts"
          git push origin HEAD:fix/starter-3d-camera-view
