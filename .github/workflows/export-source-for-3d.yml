name: Export Kitchen AI source for 3D development

on:
  push:
    branches:
      - feature/professional-dollhouse-3d
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: kitchen-ai-source-professional-3d
          path: |
            .
            !node_modules
            !dist
          include-hidden-files: true
          retention-days: 2
