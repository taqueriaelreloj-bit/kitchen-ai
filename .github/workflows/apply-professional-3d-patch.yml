name: Apply professional 3D designer patch

on:
  push:
    branches:
      - feature/professional-dollhouse-3d

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/professional-dollhouse-3d
          fetch-depth: 0

      - name: Reconstruct and apply source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          chunks = sorted(Path('.patch/professional3d').glob('chunk-*'))
          if not chunks:
              raise SystemExit('No professional 3D patch chunks were found.')
          payload = ''.join(chunk.read_text(encoding='utf-8') for chunk in chunks)
          payload = ''.join(re.findall(r'[A-Za-z0-9+/=]', payload))
          padding = (-len(payload)) % 4
          payload += '=' * padding
          archive = base64.b64decode(payload, validate=False)
          target = Path('/tmp/professional3d.tar.xz')
          target.write_bytes(archive)
          print(f'Reconstructed {target} from {len(chunks)} chunks ({len(archive)} bytes).')
          PY
          xz --test /tmp/professional3d.tar.xz
          tar -xJf /tmp/professional3d.tar.xz
          rm -rf .patch
          rm -f .github/workflows/export-source-for-3d.yml
          rm -f .github/workflows/apply-professional-3d-patch.yml

      - name: Commit professional 3D designer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add professional dollhouse 3D kitchen designer"
          git push origin HEAD:feature/professional-dollhouse-3d
