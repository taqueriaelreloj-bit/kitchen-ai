name: Apply editor workspace visibility fix

on:
  push:
    branches: [fix/editor-workspace-visibility]
    paths:
      - '.github/workflows/apply-editor-workspace-fix.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/editor-workspace-visibility
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm

      - name: Apply workspace correction
        shell: bash
        run: |
          cat <<'B64' | base64 -d | gzip -d > /tmp/editor-ui.patch
          
          B64
          git apply --check /tmp/editor-ui.patch
          git apply /tmp/editor-ui.patch
          rm -f .github/workflows/apply-editor-workspace-fix.yml

      - name: Install dependencies
        run: npm ci

      - name: Verify corrected editor
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build:web

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "Kitchen AI Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix crowded 2D editor workspace"
          git push origin HEAD:fix/editor-workspace-visibility
