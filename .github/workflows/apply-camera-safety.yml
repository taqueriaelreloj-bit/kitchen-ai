name: Apply Camera Safety

on:
  push:
    branches: [feature/camera-safety]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Wire camera safety') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/camera-safety
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - run: node scripts/apply-camera-safety.mjs
      - run: |
          git config user.name "Kitchen AI Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Wire camera safety into 3D navigation"
          git push origin HEAD:feature/camera-safety
