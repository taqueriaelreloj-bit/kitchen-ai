name: Build Luis Kitchen AI Review

on:
  push:
    branches:
      - review/luis-10x11-kitchen
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Kitchen AI review
        run: npm run build:web

      - name: Upload Kitchen AI review
        uses: actions/upload-artifact@v4
        with:
          name: luis-10x11-kitchen-ai-review
          path: dist
          if-no-files-found: error
          retention-days: 7
