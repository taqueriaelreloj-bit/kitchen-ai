name: Apply Native 3D Picking

on:
  push:
    branches: [feature/native-3d-picking]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Wire native 3D picking') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-3d-picking
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm
      - run: npm ci
      - run: CI=1 npx expo install expo-gl
      - run: if [ -f scripts/apply-native-real-3d.mjs ]; then node scripts/apply-native-real-3d.mjs; fi
      - run: node scripts/apply-native-3d-picking.mjs
      - run: |
          git config user.name "Kitchen AI Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Wire native 3D picking and selection"
          git push origin HEAD:feature/native-3d-picking
