name: Apply Native Real 3D

on:
  push:
    branches: [feature/native-real-3d]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Wire native OpenGL 3D') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-real-3d
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm
      - run: npm ci
      - run: CI=1 npx expo install expo-gl
      - run: node scripts/apply-native-real-3d.mjs
      - run: |
          git config user.name "Kitchen AI Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Wire native OpenGL 3D renderer"
          git push origin HEAD:feature/native-real-3d
