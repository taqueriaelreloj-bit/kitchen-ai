name: Apply Professional Appliance Catalog UI

on:
  push:
    branches: [feature/pro-appliance-catalog]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Wire professional appliance catalog') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pro-appliance-catalog
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - run: node scripts/apply-appliance-catalog-ui.mjs
      - run: |
          git config user.name "Kitchen AI Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Wire professional appliance catalog into editors"
          git push origin HEAD:feature/pro-appliance-catalog
