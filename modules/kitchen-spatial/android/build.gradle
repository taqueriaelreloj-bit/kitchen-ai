plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.taqueriaelreloj.kitchenspatial'
version = '0.1.0'

android {
  namespace "com.taqueriaelreloj.kitchenspatial"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.google.ar:core:1.54.0'
}
